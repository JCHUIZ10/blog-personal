service: blog
runtime: php82

handlers:
# 1. Página principal (index.html)
- url: /
  static_files: public/index.html
  upload: public/index.html

# 2. Página de proyectos
- url: /proyectos
  static_files: public/proyectos.html
  upload: public/proyectos.html

# 3. Imágenes y recursos multimedia
- url: /(.+\.(gif|png|jpg|jpeg|svg|ico|webp))$
  static_files: public/\1
  upload: public/.+\.(gif|png|jpg|jpeg|svg|ico|webp)$

# 4. Hojas de estilo y scripts JS
- url: /(.+\.(css|js|json))$
  static_files: public/\1
  upload: public/.+\.(css|js|json)$

# 5. Cualquier otro recurso o componente dentro de public/
- url: /(.*)
  static_files: public/\1
  upload: public/.*
